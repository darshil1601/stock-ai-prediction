name: Sync Models to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Train AI Models"]
    types:
      - completed

jobs:
  deploy:
    name: Sync Models to HF Model Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install huggingface_hub
        run: pip install huggingface_hub

      - name: 📤 Upload LATEST Model Files to HF Hub via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import glob, os, shutil
          from huggingface_hub import HfApi

          api = HfApi()
          REPO_ID = "darshil16/stock-models"
          REPO_TYPE = "model"
          LOCAL_MODELS_DIR = "backend/app/models"
          SYMBOLS = ["btcusd", "eurusd", "xauusd"]

          upload_dir = "/tmp/hf_models_upload"
          if os.path.exists(upload_dir):
              shutil.rmtree(upload_dir)
          os.makedirs(upload_dir, exist_ok=True)

          for slug in SYMBOLS:
              versioned_models = sorted(glob.glob(f"{LOCAL_MODELS_DIR}/{slug}_model_v*.h5"))
              versioned_scalers = sorted(glob.glob(f"{LOCAL_MODELS_DIR}/{slug}_scaler_v*.pkl"))
              base_model = f"{LOCAL_MODELS_DIR}/{slug}_lstm_model.h5"
              base_scaler = f"{LOCAL_MODELS_DIR}/{slug}_scaler.pkl"

              files_to_copy = []
              if versioned_models:
                  files_to_copy.append(versioned_models[-1])
              if versioned_scalers:
                  files_to_copy.append(versioned_scalers[-1])
              if os.path.exists(base_model):
                  files_to_copy.append(base_model)
              if os.path.exists(base_scaler):
                  files_to_copy.append(base_scaler)

              for f in files_to_copy:
                  shutil.copy2(f, upload_dir)
                  print(f"  📦 Selected for HF upload: {os.path.basename(f)}")

          selected = os.listdir(upload_dir)
          if not selected:
              print("⚠️  No model files found to upload.")
          else:
              print(f"\n📤 Uploading {len(selected)} model file(s) to {REPO_ID}...")
              try:
                  api.create_repo(
                      repo_id=REPO_ID,
                      repo_type=REPO_TYPE,
                      token=os.environ["HF_TOKEN"],
                      exist_ok=True
                  )
              except Exception as err:
                  print(f"⚠️ Repo check/create info: {err}")

              api.upload_folder(
                  folder_path=upload_dir,
                  path_in_repo="models",
                  repo_id=REPO_ID,
                  repo_type=REPO_TYPE,
                  token=os.environ["HF_TOKEN"],
                  commit_message="chore: sync latest trained models",
              )
              print(f"✅ Upload complete! {len(selected)} model files synced successfully.")
          EOF
