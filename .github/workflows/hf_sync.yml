name: Sync to Hugging Face

on:
  push:
    branches:
      - main  # Every push to main syncs code to HF Space
  workflow_run:
    workflows: ["Train AI Models"]
    types:
      - completed

jobs:
  deploy:
    name: Sync Code to HF Space
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run for direct push OR when training workflow succeeds
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true  # Required: download actual .h5/.pkl files, not LFS pointers

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install huggingface_hub
        run: pip install huggingface_hub

      - name: 🚀 Push Code to HF Space (clean history, no binaries)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Stage code in a temp directory
          mkdir hf_payload

          # Copy backend code preserving folder structure (Dockerfile expects backend/)
          mkdir -p hf_payload/backend
          rsync -av \
            --exclude='*.h5' \
            --exclude='*.pkl' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            backend/ hf_payload/backend/

          # Copy HF Space required config files
          cp backend/README.md hf_payload/README.md 2>/dev/null || true
          cp Dockerfile hf_payload/Dockerfile 2>/dev/null || true
          cp runtime.txt hf_payload/runtime.txt 2>/dev/null || true

          # Init a FRESH git repo (orphan = no history = no binary files ever)
          cd hf_payload
          git init
          git checkout --orphan main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "sync: clean code deploy from GitHub Actions"

          # Force push the clean history to HF Space (no binaries in history)
          git push --force \
            https://darshil16:$HF_TOKEN@huggingface.co/spaces/darshil16/stock-prediction-api \
            main

          echo "✅ Clean code sync to HF Space complete."

      - name: 📤 Upload LATEST Model Files to HF Space via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import glob, os, re, shutil
          from huggingface_hub import HfApi

          api = HfApi()
          REPO_ID = "darshil16/stock-prediction-api"
          REPO_TYPE = "space"
          LOCAL_MODELS_DIR = "backend/app/models"
          HF_MODELS_DIR = "backend/app/models"
          SYMBOLS = ["btcusd", "eurusd", "xauusd"]

          # ── Step 1: Select ONLY the latest model + scaler per symbol ───────────
          upload_dir = "/tmp/hf_models_upload"
          if os.path.exists(upload_dir):
              shutil.rmtree(upload_dir)
          os.makedirs(upload_dir, exist_ok=True)

          for slug in SYMBOLS:
              versioned_models = sorted(glob.glob(f"{LOCAL_MODELS_DIR}/{slug}_model_v*.h5"))
              versioned_scalers = sorted(glob.glob(f"{LOCAL_MODELS_DIR}/{slug}_scaler_v*.pkl"))
              base_model = f"{LOCAL_MODELS_DIR}/{slug}_lstm_model.h5"
              base_scaler = f"{LOCAL_MODELS_DIR}/{slug}_scaler.pkl"

              files_to_copy = []
              if versioned_models:
                  files_to_copy.append(versioned_models[-1])  # latest version only
              if versioned_scalers:
                  files_to_copy.append(versioned_scalers[-1])  # latest version only
              if os.path.exists(base_model):
                  files_to_copy.append(base_model)
              if os.path.exists(base_scaler):
                  files_to_copy.append(base_scaler)

              for f in files_to_copy:
                  shutil.copy2(f, upload_dir)
                  print(f"  📦 Selected for HF upload: {os.path.basename(f)}")

          selected = os.listdir(upload_dir)
          if not selected:
              print("⚠️  No model files found to upload.")
          else:
              print(f"\n📤 Uploading {len(selected)} file(s) (latest only)...")
              api.upload_folder(
                  folder_path=upload_dir,
                  path_in_repo=HF_MODELS_DIR,
                  repo_id=REPO_ID,
                  repo_type=REPO_TYPE,
                  token=os.environ["HF_TOKEN"],
                  commit_message="chore: update latest trained models",
              )
              print(f"✅ Upload complete! {len(selected)} files.")
          EOF
